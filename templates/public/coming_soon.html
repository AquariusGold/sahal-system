{% extends 'base.html' %}

{% block title %}{{ module_name }} - Coming Soon | SAHAL{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-4">
    <div class="text-center max-w-md">
        <div class="w-20 h-20 mx-auto mb-6 rounded-2xl bg-gradient-to-br from-blue-500 to-slate-700 flex items-center justify-center shadow-md">
            <i data-lucide="hammer" class="w-10 h-10 text-white"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-3">{{ module_name }}</h1>
        <p class="text-gray-500 mb-8">This module is under development and will be available soon. Check back later!</p>
        <a href="/" class="inline-flex items-center gap-2 bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back to Apps Menu
        </a>
    </div>
</section>
{% endblock %}
