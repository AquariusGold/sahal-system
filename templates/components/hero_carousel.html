<section id="{{ carousel_id }}" class="hero-carousel relative h-[33vh] min-h-[250px] max-h-[350px] overflow-hidden bg-sahal-navy">
    {% for slide in hero_slides %}
    <div class="hero-carousel-slide absolute inset-0 {% if loop.first %}opacity-100{% else %}opacity-0{% endif %} transition-opacity duration-700 ease-out" data-slide>
        {% if slide.image %}<img src="{{ url_for('static', filename=slide.image) }}" alt="{{ slide.title }}" class="h-full w-full object-cover">{% else %}<div class="h-full w-full bg-sahal-navy"></div>{% endif %}
    </div>
    {% endfor %}
    <div class="absolute inset-y-0 left-0 z-[1] w-[65%] bg-gradient-to-r from-sahal-navy/80 via-sahal-navy/55 to-transparent"></div>
    <div class="absolute inset-0 z-[2] mx-auto flex max-w-7xl items-center px-5 sm:px-6 lg:px-8">
        {% for slide in hero_slides %}
        <div class="absolute max-w-2xl {% if loop.first %}translate-x-0 opacity-100{% else %}-translate-x-4 opacity-0{% endif %} transition-all duration-700 ease-out" data-slide-copy>
            <p class="text-xs font-subheading font-bold uppercase tracking-[0.18em] text-sahal-yellow drop-shadow">{{ slide.eyebrow }}</p>
            <h1 class="mt-3 font-heading text-3xl font-bold leading-tight text-white drop-shadow sm:text-4xl">{{ slide.title }}</h1>
            <p class="mt-3 max-w-xl text-sm leading-6 text-blue-50 drop-shadow sm:text-base">{{ slide.description }}</p>
        </div>
        {% endfor %}
    </div>
    {% if hero_slides|length > 1 %}<div class="absolute bottom-5 right-4 z-10 flex items-center gap-2 sm:right-6 lg:right-8">{% for slide in hero_slides %}<button type="button" class="hero-carousel-dot h-2.5 w-2.5 rounded-full transition {% if loop.first %}bg-sahal-yellow{% else %}bg-white/50{% endif %}" data-slide-dot="{{ loop.index0 }}" aria-label="Show slide {{ loop.index }}"></button>{% endfor %}</div>{% endif %}
</section>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const carousel = document.getElementById('{{ carousel_id }}');
    if (!carousel) return;
    const slides = carousel.querySelectorAll('[data-slide]');
    const copies = carousel.querySelectorAll('[data-slide-copy]');
    const dots = carousel.querySelectorAll('[data-slide-dot]');
    if (slides.length < 2) return;
    let current = 0;
    let timer;
    function hideSlide(index) {
        slides[index].classList.remove('opacity-100'); slides[index].classList.add('opacity-0');
        copies[index].classList.remove('opacity-100', 'translate-x-0'); copies[index].classList.add('opacity-0', '-translate-x-4');
        if (dots[index]) { dots[index].classList.remove('bg-sahal-yellow'); dots[index].classList.add('bg-white/50'); }
    }
    function revealSlide(index) {
        slides[index].classList.remove('opacity-0'); slides[index].classList.add('opacity-100');
        copies[index].classList.remove('opacity-0', '-translate-x-4'); copies[index].classList.add('opacity-100', 'translate-x-0');
        if (dots[index]) { dots[index].classList.remove('bg-white/50'); dots[index].classList.add('bg-sahal-yellow'); }
    }
    function showSlide(index) { if (index === current) return; hideSlide(current); current = index; revealSlide(current); }
    function startTimer() { if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) timer = window.setInterval(function () { showSlide((current + 1) % slides.length); }, 5500); }
    dots.forEach(function (dot) { dot.addEventListener('click', function () { showSlide(Number(dot.dataset.slideDot)); window.clearInterval(timer); startTimer(); }); });
    startTimer();
});
</script>
